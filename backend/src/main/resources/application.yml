# =====================================================
# CONFIGURACIÓN DE LA APLICACIÓN
# =====================================================
#
# Puertos, CORS y paths se configuran aquí.
# Variables de entorno se cargan desde .env via AppConfig.
# La URL base del frontend se define en frontend/js/config.js (API_URL).

# --- Servidor ---
# Puerto del backend. DEBE coincidir con API_URL de frontend/js/config.js.
server:
  port: 8001

# --- Integración GLPI ---
# URL base de la instancia GLPI (sin barra al final).
# Tokens se cargan desde variables de entorno o .env.
glpi:
  url: ${GLPI_URL:http://10.86.1.33/glpi/apirest.php}
  app-token: ${GLPI_APP_TOKEN}
  user-token: ${GLPI_USER_TOKEN}

# --- Rutas de archivos ---
# Directorio donde se guardan los ZIP/DOCX generados.
# Por defecto usa el directorio temporal del sistema.
app:
  generated-dir: ${java.io.tmpdir}/actas_glpi_generados
  # Directorio de templates Word (classpath para resources/ o ruta absoluta).
  templates-dir: classpath:plantillas
  # Orígenes CORS permitidos. En producción se sobreescribe con la
  # variable CORS_ALLOWED_ORIGINS para incluir el host del frontend.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1,http://localhost,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5501,http://localhost:5501,http://127.0.0.1:8080,http://localhost:8001}
